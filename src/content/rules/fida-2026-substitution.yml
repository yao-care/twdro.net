rulebook: fida-2026
chapter: 換人與換機
article_number: 3-2 / 3-4
title: 換人只能在局間；比賽中前鋒陣亡要靠引導手「碰」一下接棒
summary: 換人只能在每一局開始前進行，局中一律不得換人；只要在報名名單內，換人次數與人數不限，名單上的教練也可以下場當選手。換人時原本使用的球機可換可不換。比賽進行中若前鋒退出，唯一的補位方式是由引導手接任——引導手的球機必須實際碰到退出前鋒的球機，且前鋒須把遙控器放到地上，是否算數由主裁判認定，認定後由主裁判宣告。
original_text: |-
  ❷ Player Substitution
  ⓐ Substitutions are allowed only before the start of a set. No substitutions are permitted during a set.
  ⓑ There are no limits on the number of substitutions or the number of players being substituted, as long as they are within the registered player list.
  ⓒ A coach listed on the team roster is allowed to participate as a player.
  ❸ Substitution Procedure
  ⓐ For player substitution, the fact of substitution and the player to be substituted shall be notified to referee.
  ⓓ When substituting a player, the drone ball previously used may be replaced, but it is not mandatory. If the drone ball is not replaced, the inspection in ⓒ may be omitted.
  ❹ Striker Substitution During a Game
  ⓐ If the Striker withdraws from a set during the game, the Striker may be substituted by the Guide.
  ⓑ To substitute the Striker, the Guide's drone ball must contact the withdrawn Striker's drone ball.
  ⓒ The Guide may touch the Striker after the Striker withdraws and puts the controller on the floor. The Head Referee determines if the touch counts for substitution.
  ⓓ If the substitution is successful, the head referee must announce the result of the substitution in accordance with Rule 5-❼.
translated_text: |-
  ❷ 選手替換
  ⓐ 換人只能在每一局開始前進行，局中一律不得換人。
  ⓑ 只要在已登錄的選手名單內，換人的次數與人數皆不設限。
  ⓒ 列入隊伍名單的教練可以下場擔任選手。
  ❸ 替換程序
  ⓐ 換人時，須將換人事實與被替換的選手告知裁判。
  ⓓ 換人時原先使用的球機可以更換，但非強制；若不更換球機，可省略檢驗程序。
  ❹ 比賽進行中的前鋒替換
  ⓐ 若前鋒在該局比賽中退出，可由引導手接任前鋒。
  ⓑ 要完成接任，引導手的球機必須碰到已退出前鋒的球機。
  ⓒ 引導手須待前鋒退出並把遙控器放到地上後才能碰觸。該次碰觸是否成立由主裁判認定。
  ⓓ 接任成立時，主裁判須依規則 5-❼ 宣告替換結果。
