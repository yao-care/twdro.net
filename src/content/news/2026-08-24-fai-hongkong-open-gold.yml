title: APEX TEAM 拿下 2026 FAI 香港無人機足球公開賽 F9A-B 組冠軍，臺灣在該賽事的首面國際金牌
date: "2026-08-24"
summary: 中華臺北代表隊 APEX TEAM 在國際航空聯盟（FAI）認證的「2026 FAI 香港無人機足球公開賽」F9A-B 組奪冠。該賽事共有澳洲、中國、香港、澳門、馬來西亞、新加坡、中華臺北、土耳其與美國等 9 國、15 支隊伍參賽，採 FAI 標準賽制三局兩勝，經小組單循環與淘汰賽共進行 29 場。同一支 APEX TEAM 也是 2026 年 7 月 UASACT 奧賽特嘉年華無人機足球社青組冠軍。
source_url: https://sports.ltn.com.tw/news/breakingnews/5552050
source_publisher: 自由體育
