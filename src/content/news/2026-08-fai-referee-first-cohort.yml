title: 全臺首批無人機足球裁判培訓完成，將投入 115 年總統盃賽事
date: "2026-08-14"
summary: 教育部無人機教育推廣辦公室的 FAI 無人機足球裁判培訓，經北、中、南三梯次選訓後於國立高雄科技大學完訓，是全臺第一批完成培訓的無人機足球裁判，將投入 115 年總統盃競賽執法。培訓分三區辦理（北區實踐大學臺北校區、中區靜宜大學、南區高科大第一校區），16 歲以上國人皆可報名、不限教師或在校生，完訓學員有義務擔任 2026 年北中南分區競賽裁判至少 2 場。臺灣賽事近年暴增而裁判不足，這是制度面的第一步。
source_url: https://www.ydn.com.tw/tw/News/ugC_News_Detail.aspx?ID=628571
source_publisher: 青年日報
