title: 臺灣足球無人機代表隊 FIDA 仁川洲際盃 Class 20 亞軍、Class 40 殿軍，締造國際賽歷來最佳
date: "2026-07-19"
summary: 臺北市足球無人機國家代表隊赴南韓仁川參加 FIDA 無人機足球洲際盃，Class 20 拿下亞軍、Class 40 殿軍，國語日報報導稱「締造我國參與足球無人機國際賽事最佳紀錄」。代表隊由松山工農、瑠公國中、華興小學與薇閣中學等校跨學層學生組成。同一個 Class 20 級距，2025 年首屆 FIDA 世界盃是殿軍，一年之內進到亞軍。
source_url: https://www.mdnkids.com/content.asp?Link_String_=247J00000UWJDCZ
source_publisher: 國語日報
