# 那句話只出現在中時一篇報導的一句敘述裡，而且**與已證實的事實衝突**：上海那場
# （2025 FAI 世界無人機足球錦標賽，11/15–18）的臺灣代表隊是 2025-07-27 國家隊選拔賽
