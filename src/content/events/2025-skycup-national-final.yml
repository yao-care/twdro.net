# 主辦單位自己的簡章全文沒有出現過「上海」，晉級條款只寫「代表中區參加全國總決賽」。
# 合理判斷是記者把同一個月的兩件事混寫。來源怎麼寫是一回事，站上不能把它當事實陳述。
