# 縣市教育網／縣市政府公告來源清單（county_edu_news adapter 讀這一份）
#
# 加一個來源＝加一個區塊，不必改程式碼。欄位：
#   label     顯示名稱（出現在 alert 與 PR 內文）
#   url       要抓的網址
#   mode      rss  → 解析 RSS/Atom 的 <item>/<entry>
#             html → 從頁面抽 <a href>…</a> 的連結與文字
#   link_re   （html 模式選填）只保留 href 命中此正規式的連結，濾掉導覽列
#
# ── 為什麼從 1 個縣市變成 10 個（2026-08-03 第二輪實測）────────────────────────
# 第一輪只探「縣市教育網」（*.edu.tw），結論是「各縣市 CMS 不同、找不到端點」。
# 那個結論的問題出在**找錯層級**：教育網多半掛在 TANet，不少只有 IPv6、或整站擋
# 資料中心來源，本來就抓不到；而**縣市政府入口網**（*.gov.tw）幾乎都是商用 CMS，
# 依《政府網站營運交流平臺》慣例備有正規 RSS，而且**同樣會發教育處的競賽消息**——
# 站上第二筆成績（雲林縣科技教育盃）本來就是從地方新聞抄到的，不是從教育網。
#
# 換一層找之後，10 個縣市當天就接上了。挑選原則：
#   1. 有教育局處專屬 feed 就優先用（目前只有臺南市有）。
#   2. 否則取「新聞」＋「公告」各一，兩者受眾不同、發布路徑也不同。
#   3. **不收招標／決標／徵才 feed**：量大、與成績無關，只會稀釋訊號。
#
# ── 已實測失敗，別再重猜 ──────────────────────────────────────────────
# 縣市教育網（第一輪，2026-08-03）：
#   新竹縣 hcc.edu.tw／南投縣 ntct.edu.tw／新北市 ntpc.edu.tw 走另一套 CMS
#   （網址型如 /p/406-1001-<id>.php），`/app/index.php?Action=rss`、`/p/rss-*.php`、
#   `/rss.php` 等常見端點全部 404，首頁也沒有可穩定解析的公告清單頁。
#   苗栗 mlc／宜蘭 ilc／金門 km 教育網**只有 AAAA 記錄且連線逾時**；
#   雲林 ylc.edu.tw 有 A 記錄但 IPv4／IPv6 皆不通。
# 縣市政府入口（第二輪，2026-08-03）：
#   桃園市 tycg.gov.tw   → HTTP 428（需先取得 cookie，靜態抓取拿不到）
#   雲林縣 yunlin.gov.tw → HTTP 403（擋資料中心 IP）
#   新竹市 hccg.gov.tw   → HTTP 403
#   新北市 ntpc.gov.tw   → RSS 訂閱頁由 JS 產生，靜態 HTML 抽不到 feed 網址
#   苗栗縣 miaoli／花蓮縣 hl／嘉義市 chiayi／金門縣 kinmen → 全站找不到 RSS 字樣
#   新竹縣 hsinchu／臺東縣 taitung／澎湖縣 penghu／連江縣 matsu → 連線逾時
#   ⚠️ 這些多半是**擋爬蟲或前端渲染**，不是「沒有 RSS」。標頭不夠像瀏覽器就會被擋——
#      臺北市與高雄市一開始也是 403／428，補上 Accept 與 Accept-Language 後才通
#      （見 adapter 的 HEADERS 註解）。日後要救這幾個，從那裡下手，別再猜網址。
#
# 這支 adapter 的價值不在覆蓋率，而在把「每次想到才手動搜一輪」變成常態監看：
# 2026-08-03 就是靠手動搜到嘉義縣教育處的成績公告，才補上站上第一筆賽事成績
# （events/2026-chiayi-county-selection）。同一件事不該每個月重做一次。

feeds:
  # ── 教育網（唯一接得上的一個；同時是唯一提供過成績公告的來源）──
  - label: 嘉義縣教育資訊網
    url: https://www.cyc.edu.tw/modules/tadnews/rss.php
    mode: rss

  # ── 教育局處專屬 feed ──
