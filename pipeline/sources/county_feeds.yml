    mode: rss
  - label: 臺北市政府最新消息
    url: https://www.gov.taipei/OpenData.aspx?SN=D33B55D537402BAA
    mode: rss

  - label: 臺中市政府市政新聞
    url: https://www.taichung.gov.tw/10179/564770/rss?nodeId=9962
