    mode: rss
  - label: 南投縣政府最新消息
    url: https://www.nantou.gov.tw/big5/newsrss.php
    mode: rss

  - label: 臺南市政府市府新聞
    url: https://www.tainan.gov.tw/OpenData.aspx?SN=24474215983F6554
    mode: rss

  - label: 高雄市政府市政新聞
    url: https://www.kcg.gov.tw/OpenData.aspx?SN=D33B55D537402BAA
    mode: rss
  - label: 高雄市政府最新消息
    url: https://www.kcg.gov.tw/OpenData.aspx?SN=FB01D469347C76A7
    mode: rss

  - label: 屏東縣政府最新消息
    url: https://www.pthg.gov.tw/Rss_News.aspx?n=528607F80E455D7F
    mode: rss
  - label: 屏東縣政府屏東新聞
    url: https://www.pthg.gov.tw/Rss_News.aspx?n=EC690F93E81FF22D
    mode: rss

  - label: 宜蘭縣政府縣政新聞
    url: https://www.e-land.gov.tw/OpenData.aspx?SN=7E7F28876E1CB175
