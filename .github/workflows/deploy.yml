name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 是必要的——sitemap 的 lastmod 對「沒有日期欄位的內容檔與靜態頁」
      # 退回 git commit 日期（見 src/lib/lastmod.mjs）。淺層 clone 拿不到歷史，
      # 那些頁就會無聲失去 lastmod，正是 tests/sitemap-lastmod.test.ts 要擋的退化。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 20 已於 2026-04-30 EOL，2026-08-03 升到 24（當期 Active LTS，EOL 2028-04-30）。
          # 先前 CI 釘 20 而開發機是 22，兩邊版本歪掉的代價是實測過的：
          # tests/jsonld-coverage.test.ts 用了 fs.globSync（Node 22+），本機全綠、CI 直接
          # `globSync is not a function` → build 掛 → deploy 被 skip，網站那一版沒上線。
          # 版本要往前對齊受支援的 LTS，不是把程式碼遷就一個已經沒人維護的 runtime。
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # 測試必須在 build 之後（build-smoke 與 trailing-slash 兩組檢查 dist 產物），
      # 且必須在 upload 之前——2026-07-28 以前 CI 只有 ci+build，40 個測試從未在 CI 執行過，
      # 等於 seo-ops reflect/brain 與 pipeline 的自動 commit 一路無守門直接上站。
      # trailingSlash 設定錯誤（2026-07-19～21）就是這樣無聲送到 Google 面前的。
      - run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 來源網址健檢：獨立 job，**刻意不擋部署**（不在 deploy 的 needs 裡）。
  # 學校公告下架、換網址是常態，第三方偶發不穩不該讓網站發不出去；但這個 job 失敗會
  # 讓整個 workflow 標記失敗並寄通知，問題看得見。
  # 已確認永久下架又暫時找不到替代的，在該筆來源加 unavailable_since 即降級成提醒。
  source-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 已於 2026-04-30 EOL，2026-08-03 升到 24（當期 Active LTS，EOL 2028-04-30）。
          # 先前 CI 釘 20 而開發機是 22，兩邊版本歪掉的代價是實測過的：
          # tests/jsonld-coverage.test.ts 用了 fs.globSync（Node 22+），本機全綠、CI 直接
          # `globSync is not a function` → build 掛 → deploy 被 skip，網站那一版沒上線。
          # 版本要往前對齊受支援的 LTS，不是把程式碼遷就一個已經沒人維護的 runtime。
          node-version: '24'
      - run: node scripts/check-source-links.mjs

  # 上線後才推 IndexNow：讀的是線上 sitemap，只推 lastmod 在 3 天內的網址。
  # 失敗不影響部署（deploy 已經完成），所以 continue-on-error。
  # 注意：Google 不參與 IndexNow，Google 端靠 sitemap lastmod 與 GSC 手動要求索引。
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 已於 2026-04-30 EOL，2026-08-03 升到 24（當期 Active LTS，EOL 2028-04-30）。
          # 先前 CI 釘 20 而開發機是 22，兩邊版本歪掉的代價是實測過的：
          # tests/jsonld-coverage.test.ts 用了 fs.globSync（Node 22+），本機全綠、CI 直接
          # `globSync is not a function` → build 掛 → deploy 被 skip，網站那一版沒上線。
          # 版本要往前對齊受支援的 LTS，不是把程式碼遷就一個已經沒人維護的 runtime。
          node-version: '24'
      - run: node scripts/indexnow-submit.mjs
