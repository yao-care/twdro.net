name: Pipeline · 縣市教育網公告監控
# 為什麼有這支（2026-08-03）：
# pipeline-organizer 的註解寫著「全臺沒有任何可爬取的網頁在公布無人機足球賽事成績」，
# 據此把成績當成只能等主辦單位發佈的市場級缺口。**那個結論的範圍下錯了。**
# 本日查具體查詢「無人機足球比賽嘉義縣蒜頭國小」時發現：縣市政府教育處會公告成績——
# 嘉義縣政府教育處 2026-05-29 的成績公告就是站上第一筆賽事成績的來源。
# 舊結論對天穹盃系列仍成立（主辦協會確實沒公布），但不適用於縣市層級：那一層一直在
# 公告，只是沒有人在看。這支就是別再讓「想到才手動搜一輪」決定我們拿不拿得到成績。
# 只偵測不改寫——成績屬事實型資料（站規鐵則 1），一律人工核實後手動上站。
on:
  schedule:
    - cron: '0 22 * * *'   # 每天 06:00 台北時間（避開 organizer 的 05:30 與其他 pipeline）
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      # 只讀公告標題與連結，不涉個資 → 用 dev 依賴（免裝 torch／CKIP）。
      - run: pip install -r pipeline/requirements-dev.txt
      - name: 縣市教育網公告監控
        run: python -m pipeline.run --source county_edu_news
      - name: 開 PR（若出現無人機足球相關新公告）
        if: ${{ hashFiles('pipeline/state/pr-body.md') != '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: pipeline/county-edu
          title: '資料 pipeline：縣市教育網無人機足球公告（可能含賽事成績）'
          body-path: pipeline/state/pr-body.md
          labels: |
            data-pipeline
            needs-review
          add-paths: |
            pipeline/state/county-edu-alerts/**
            pipeline/state/manifest.json
